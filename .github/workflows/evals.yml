name: Deterministic Agent Evals & Regression Testing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Evals
        run: |
          pytest evals/test_eval_benchmarks.py -v --tb=short
